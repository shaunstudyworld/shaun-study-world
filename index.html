
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shaun Study World</title>

<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#d7f4ff,#ffffff);
min-height:100vh;
}

header{
padding:25px;
text-align:center;
}

header h1{
font-size:38px;
color:#1e3a8a;
}

header p{
color:#555;
margin-top:8px;
}

.card{
background:white;
width:min(900px,92%);
margin:20px auto;
border-radius:25px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.stats{
display:flex;
justify-content:center;
gap:20px;
margin:20px 0;
flex-wrap:wrap;
}

.badge{
background:#fff4b5;
padding:10px 18px;
border-radius:999px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-top:20px;
}

.world{
background:#eef8ff;
padding:20px;
border-radius:20px;
text-align:center;
cursor:pointer;
transition:.25s;
}

.world:hover{
transform:translateY(-5px);
background:#dbeafe;
}

.world span{
font-size:40px;
display:block;
margin-bottom:10px;
}

button{
margin-top:25px;
padding:15px 28px;
font-size:18px;
border:none;
border-radius:15px;
background:#2563eb;
color:white;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#1d4ed8;
}

footer{
text-align:center;
padding:30px;
color:#666;
font-size:14px;
}
</style>

</head>
<body>

<header>

<h1>🎵 Shaun Study World</h1>

<p>四年级互动学习世界 · Standard 4</p>

</header>

<div class="card">

<div class="stats">

<div class="badge">⭐ XP：0</div>

<div class="badge">🏆 Level：1</div>

</div>

<h2 style="text-align:center;">今天学习什么？</h2>

<div class="grid">

<div class="world">
<span>🎺</span>
乐器王国
</div>

<div class="world">
<span>🎼</span>
五线谱森林
</div>

<div class="world">
<span>🎵</span>
音符山谷
</div>

<div class="world">
<span>🎤</span>
Recorder学院
</div>

<div class="world">
<span>🎋</span>
Angklung村
</div>

<div class="world">
<span>🏰</span>
考试城堡
</div>

</div>

<div style="text-align:center;">

<button onclick="alert('欢迎来到 Shaun Study World！下一版我们会加入真正可以玩的互动题目！')">

开始冒险 ▶

</button>

</div>

</div>

<div class="card">

<h2>🎯 今日目标</h2>

<ul style="margin-top:15px;line-height:2;">

<li>认识6种乐器</li>

<li>学会五线谱</li>

<li>完成3题获得星星⭐</li>

</ul>

</div>

<footer>

Shaun Study World © 2026

</footer>

</body>
</html>
